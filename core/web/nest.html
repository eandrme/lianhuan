<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no,interactive-widget=resizes-content">
<!-- ── 加到主屏（跟 / 那份一份不差）──
     ★ iOS 只认下面这几行，**不认 manifest**：图标必须是 PNG（不吃 SVG），
       名字取自 apple-mobile-web-app-title。manifest 是安卓 / Chrome 那边的。
     ★ 这四个文件在 gate 的 PUBLIC_ASSETS 里 —— 不带 cookie 也得给，
       不然 iOS 抓不到图，主屏上就是一张网页截图。 -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="巢">
<meta name="application-name" content="巢">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1115">
<title>巢</title>
<!-- ★ 图标模块必须**先于**内联脚本加载：外壳自己就要画图标（汉堡/思考/收藏星…），
     放在后面的话那几处会当场 "nestIcon is not defined"。 -->
<script src="/nest-icon.js?v=1"></script>
<style>
/* ══════ 设计变量：以后只改这一块 ══════ */
:root{
  /* ══ 和纸墨晕 × 海沫玻璃：只改这一块就能换整站的皮 ══
     和纸底 paper · 墨晕 ink · 海沫玻璃 foam · 唯一强调色 accent */
  --paper:#F2EDE2; --paper-2:#EDE6D8;
  --ink-1:#6E8296; --ink-2:#55677C; --ink-3:#93A6B8;
  --tx-1:#46505C; --tx-2:#7C8794; --tx-3:#A7B0BB;
  --foam-1:#F6FAFC; --foam-2:#DCEAF3; --foam-3:#C3D9E8;
  /* ★ #6E93B3 是**唯一**的强调色。别处再要「重点」也只用它，或者用青灰 --ink-1。
     暖土金那一族（上一版的主色）一个都不留。 */
  --accent:#6E93B3;
  /* 拉丁小标签专用灰：全大写、宽字距那些字用它，比正文元信息再冷一档 */
  --latin-c:#8A95A2;
  /* ── 老名字（各模块读的就是这一套，一个都不许删）── */
  --bg:var(--paper); --fg:var(--tx-1); --dim:var(--tx-2); --dim2:var(--tx-3);
  --panel:rgba(255,255,255,.42); --panel2:rgba(255,255,255,.24);
  --line:rgba(110,130,150,.20);
  /* 语义色只留「能认出来」这一点用处，色相全部压进冷调 ——
     原来的「进行中」是一块暖土金，跟这套皮冲突，换掉了。 */
  --ok:#6E9E86; --err:#B0757C; --warn:#9A8FA8;
  --r:24px; --r-sm:12px; --gap:10px; --pad:16px;
  --fs:15px; --lh:1.8; --colw:720px; --sidew:300px;
  /* ★ 不引 Google Fonts：那台在手机上常常是**连不上**的，而 <link> 是阻塞渲染的 ——
     一整页会白等它超时。宋体用系统里的：iOS 有 Songti SC，安卓中文机多半有思源宋。
     想要一模一样的那款字，把字体文件丢进 core/web/fonts/，我再加 @font-face。 */
  --font:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* 拉丁标签一律 Jost：本机有就用，没有就退回无衬线。
     ★ 同样不引外链 —— Jost 的 woff2 丢进 core/web/fonts/ 就能真用上。 */
  --latin:"Jost","Jost*","Futura","Avenir Next","Century Gothic",var(--mono);
  --glass-bg:rgba(255,255,255,.42);
  --glass-line:rgba(255,255,255,.65);
  /* ★ 全站只有这一种阴影。纯黑阴影、暖色阴影一律不出现。 */
  --shadow:0 10px 24px rgba(70,100,130,.10);
}
/* ── 深色 · 月光版（照同一套色相，只是把纸换成夜）── */
:root[data-moon="1"]{
  --paper:#1C2430; --paper-2:#232E3C;
  --ink-1:#8FA8BE; --ink-2:#6E8296; --ink-3:#5B6C7E;
  --tx-1:#DCE4EC; --tx-2:#9FAEBD; --tx-3:#7C8B9A;
  --accent:#8FB4D4;
  --latin-c:#93A0AE;
  --panel:rgba(255,255,255,.08); --panel2:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.12);
  --ok:#7FB79B; --err:#C08E92; --warn:#A79CB5;
  --glass-bg:rgba(255,255,255,.08);
  --glass-line:rgba(255,255,255,.14);
  /* ★ 月亮底下也照样不许用纯黑阴影 —— 跟白天是同一条规矩。 */
  --shadow:0 10px 24px rgba(70,100,130,.10);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:var(--fs)/var(--lh) var(--font);
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}

#app{display:flex;height:100dvh}
/* ★ 表单控件一律 16px：iOS 在 font-size < 16px 的输入框上会自动把**整页**放大，
   而且不缩回去 —— 聊天框、搜索、每个弹层里的输入框都会触发。
   16 是最低线，不是审美。!important 是为了压过各模块自己那条 `font:inherit`。 */
input,textarea,select{font-size:16px!important}
#chatCol{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:10px var(--pad);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
.brand{font-weight:500;letter-spacing:.5px}
.sp{flex:1}
.ibtn{padding:6px 10px;border-radius:var(--r-sm);color:var(--dim)}
.ibtn:hover{background:var(--panel2);color:var(--fg)}

#stream{flex:1;overflow-y:auto;padding:var(--pad) var(--pad) 18px;scroll-behavior:smooth}
.turn{max-width:var(--colw);margin:0 auto 22px}
.turn .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim2);margin-bottom:6px}
.turn.me .meta{justify-content:flex-end}
.cp{font-size:12px;color:var(--dim2);padding:2px 6px;border-radius:6px}
.cp:hover{background:var(--panel2);color:var(--fg)}
.bubbles{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.turn.me .bubbles{align-items:flex-end}
.bubble{background:var(--panel2);border:0;border-radius:var(--r);
  padding:9px 13px;max-width:76%;white-space:pre-wrap;word-break:break-word}
.turn.me .bubble{background:rgba(220,234,243,.58);color:var(--tx-1)}
/* 被「重新生成」换掉的旧回复：读得出来、但看得出它已经不是活的那条 */
.turn.sup .bubble{opacity:.5}
.turn.sup .meta{opacity:.6}
.supnote{font-size:12px;color:var(--dim2);border-left:2px solid var(--line);
  padding:1px 0 1px 8px;margin-top:7px;max-width:88%}
/* 气泡里的附件：图直接看得见，文件给名字（点开是原文件） */
.atts{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 7px}
.turn.me .atts{justify-content:flex-end}
.att-img img{display:block;max-width:min(230px,62vw);max-height:230px;
  border-radius:11px;border:1px solid var(--line)}
.att-file{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
  font-size:13px;color:var(--dim);background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:7px 11px;max-width:76vw}
.att-file .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

details.think{margin:0 0 7px;background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--glass-line);
  border-radius:var(--r-sm);overflow:hidden}
details.think>summary{list-style:none;cursor:pointer;padding:7px 11px;display:flex;
  gap:7px;align-items:center;font-size:13px;color:var(--dim)}
details.think>summary::-webkit-details-marker{display:none}
details.think pre{margin:0;padding:0 12px 10px;font:12.5px/1.55 var(--mono);
  color:var(--dim);white-space:pre-wrap;max-height:320px;overflow:auto}
details.think .sec{color:var(--dim2)}

.stage{font-size:11px;color:var(--tx-3);margin:0 0 8px;padding-left:2px;
  display:flex;align-items:center;gap:8px;letter-spacing:.16em}
.stage .foam{display:inline-flex;gap:4px;align-items:flex-end;height:9px}
.stage .foam i{width:5px;height:5px;border-radius:50%;background:var(--accent);
  opacity:.25;animation:bubbleUp 1.6s ease-in-out infinite}
.stage .foam i:nth-child(2){animation-delay:.22s}
.stage .foam i:nth-child(3){animation-delay:.44s}

.tools{display:flex;flex-direction:column;gap:5px;margin:0 0 7px}
.tool{border:1px solid var(--glass-line);background:var(--glass-bg);border-radius:var(--r-sm);font-size:13px;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.tool .thead{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer}
.tool .tname{font-family:var(--mono);font-size:12.5px}
.tool .tms{color:var(--tx-3);font-size:10px;letter-spacing:.14em;font-family:var(--latin)}
.tool .tcar{margin-left:auto;color:var(--dim2);transition:transform .15s}
.tool.open .tcar{transform:rotate(180deg)}
.tool .tbody{display:none;border-top:1px solid var(--line);padding:8px 10px}
.tool.open .tbody{display:block}
.tool pre{margin:0;font:12px/1.5 var(--mono);color:var(--dim);white-space:pre-wrap;word-break:break-all}
.tool[data-state=run] .ticon{color:var(--warn)}
.tool[data-state=ok]  .ticon{color:var(--ok)}
.tool[data-state=err] .ticon{color:var(--err)}

.errbox{max-width:88%;border:1px solid var(--err);
  background:color-mix(in srgb,var(--err) 12%,transparent);color:var(--err);
  border-radius:var(--r-sm);padding:8px 11px;font-size:13px}
.usage{font-size:10px;color:var(--tx-3);margin-top:6px;font-family:var(--latin);
  letter-spacing:.14em}
.hint{max-width:var(--colw);margin:44px auto;text-align:center;color:var(--dim2);font-size:13px}

#composer{border-top:1px solid var(--line);background:var(--bg);
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom))}
#composer .row{max-width:var(--colw);margin:0 auto;display:flex;gap:8px;align-items:flex-end;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 12px}
#ta{flex:1;resize:none;background:none;border:0;outline:none;color:var(--fg);
  font:inherit;max-height:38vh;padding:5px 0}
/* ★ 这里只是「还没铺到玻璃那一层」的兜底；#btnSend 的真样子在下面
   「和纸墨晕 × 海沫玻璃」那一段。两条要**说同一件事** —— 老代码里
   这里原来是实心 accent 底 + 实心 err 底，而后来的 `.stop` 只改描边和字色，
   实心底就留下来了：红底红字，按下去那一下什么都看不见。 */
#btnSend{padding:8px 16px;border-radius:var(--r-sm);background:transparent;
  color:var(--accent);font-weight:500;white-space:nowrap}
#btnSend.stop{background:transparent;color:var(--err)}

#side{width:var(--sidew);flex:0 0 var(--sidew);border-left:1px solid var(--line);
  background:var(--panel);overflow:auto;padding:var(--pad);transition:transform .2s ease}
#app.side-off #side{transform:translateX(105%)}
@media (max-width:820px){
  #side{position:fixed;right:0;top:0;bottom:0;z-index:20;box-shadow:var(--shadow)}
  #app.side-off #side{transform:translateX(105%)}
  .bubble{max-width:94%}
}

#gate{position:fixed;inset:0;background:var(--bg);display:flex;
  align-items:center;justify-content:center;z-index:50}
#gate .card{width:min(340px,86vw);display:flex;flex-direction:column;gap:12px;text-align:center}
#gate input{padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--glass-line);
  background:var(--glass-bg);color:var(--fg);font:inherit;outline:none}
#gate button{padding:12px;border-radius:var(--r-sm);background:var(--glass-bg);
  border:1px solid var(--accent);color:var(--accent);font-weight:500}
.muted{color:var(--dim2);font-size:12.5px}

/* ══════════════════════════════════════════════════════════
   和纸墨晕 × 海沫玻璃
   ══════════════════════════════════════════════════════════ */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-noise{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay}
/* 纸面受光：只是让顶上亮一点，色相是冷的（原来那层 #FFFDF8 偏暖，换掉了） */
.bg-warm{position:absolute;inset:0;opacity:.45;
  background:radial-gradient(120% 80% at 50% 0%,#FBFDFE 0%,rgba(251,253,254,0) 62%)}
:root[data-moon="1"] .bg-noise{opacity:.10}
:root[data-moon="1"] .bg-warm{opacity:.30;
  background:radial-gradient(120% 80% at 50% 0%,rgba(120,160,200,.16) 0%,rgba(70,100,130,0) 60%)}
:root[data-moon="1"] .bg-art{opacity:.55}
.bg-art{position:absolute;inset:0;width:100%;height:100%}
.blob{animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-direction:alternate}
.drift1{animation-name:drift1;animation-duration:34s}
.drift2{animation-name:drift2;animation-duration:40s}
.drift3{animation-name:drift3;animation-duration:27s}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,26px) scale(1.07)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.04)}50%{transform:translate(-24px,14px) scale(.96)}}
@keyframes drift3{0%,100%{transform:translate(-8px,12px) scale(1)}50%{transform:translate(16px,-18px) scale(1.05)}}
/* 头像呼吸：4s、scale 1 → 1.02（只一点点，像在喘气，不是心跳） */
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes bubbleUp{0%,100%{opacity:.2;transform:translateY(2px) scale(.8)}50%{opacity:.85;transform:translateY(-2px) scale(1.1)}}
@keyframes msgIn{0%{opacity:0;filter:blur(6px);transform:translateY(6px)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes pageIn{0%{opacity:0;transform:translateX(10px)}100%{opacity:1;transform:none}}
/* ★ 降低动效偏好：不是「全都别动」，而是**退化成纯淡入**。
   漂移 / 呼吸 / 上浮一律停住，位移和模糊也一起去掉 —— 只留下透明度的渐显，
   这样「消息进来了」这件事还看得见，但没有任何东西在动。 */
@media (prefers-reduced-motion:reduce){
  .blob{animation:none!important}
  .tide .avs .a,.hm-ava{animation:none!important}
  .stage .foam i,.stage .dots i,.dots i{animation:none!important;opacity:.6}
  *{animation-name:none!important;transition-property:opacity,color,background-color,border-color!important}
  /* 页面切换 / 消息入场：退化成纯淡入（横向位移和模糊都去掉） */
  .turn,#pane,.sheet .box,.hm-in{animation:fadeIn 420ms ease forwards!important}
  #bg{animation:none!important}
  /* hover 上浮 / 按压缩放也一起去掉 */
  .nt-card:hover,.set-sec:hover,.ty-card:hover,.ph-card:hover,.mem-card:hover,
  .st-book:hover,.tide-row>*:hover,.cr-card:hover,.cr-note:hover,button:active{
    transform:none!important}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
}
#app{position:relative;z-index:1}
/* 玻璃：通透，不是磨砂塑料。全站卡片 / 导航 / 输入框都用这一种材质。 */
.glass{
  background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--glass-line);
  box-shadow:var(--shadow);
}
/* 玻璃卡轻轻浮起来 2px —— 只给「可以点、可以看」的卡，不给输入框那一行。
   具名的那一长串在 nest-skin2.js（那一层排在各模块之后，才盖得住它们自己的样式）。 */
.glass{transition:transform .28s ease,box-shadow .28s ease}
/* ── 顶栏：极简，一条细线收尾 ── */
#bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) var(--pad) 8px;
  position:sticky;top:0;z-index:6;border-bottom:1px solid var(--glass-line);
  background:var(--glass-bg);
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
#bar .who{display:flex;flex-direction:column;line-height:1.15;min-width:0}
#bar .who b{font-weight:500;font-size:16px;letter-spacing:.08em;color:var(--tx-1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
/* 拉丁标签：Jost、全大写、字距 .24em、10~13px、#8A95A2 */
#bar .who span{font-family:var(--latin);font-size:10px;letter-spacing:.24em;color:var(--latin-c);
  text-transform:uppercase}
#bar .ibtn{padding:6px;border-radius:12px;color:var(--tx-2)}
#bar .ibtn:hover{background:var(--panel2);color:var(--tx-1)}
#bar .me{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:0 0 32px;
  border:1px solid var(--glass-line);background:var(--panel2);
  background-size:cover;background-position:center;color:var(--tx-2);font-size:12px;
  display:flex;align-items:center;justify-content:center}
#bar .me img{width:100%;height:100%;object-fit:cover;display:block}
/* 头像呼吸：4s、scale 1 → 1.02 */
#bar .me{animation:breathe 4s ease-in-out infinite;transform-origin:50% 50%}
#gate .card{padding:26px 22px;display:flex;flex-direction:column;gap:12px;text-align:center;
  width:min(340px,86vw);border-radius:26px}
.gate-mark{width:44px;height:44px;margin:0 auto;color:var(--accent)}
.gate-mark .ni,.gate-mark svg{width:44px;height:44px}
/* ── 消息流 ── */
#stream{padding:18px var(--pad) 22px}
.empty-verse{display:flex;justify-content:center;align-items:flex-start;gap:16px;
  margin:14vh auto 0;max-width:var(--colw)}
.empty-verse .v{writing-mode:vertical-rl;text-orientation:upright;
  font-size:15px;letter-spacing:.34em;line-height:1;color:var(--dim);opacity:.9;
  max-height:46vh}
.empty-verse .ln{width:1px;height:64px;background:currentColor;opacity:.30;color:var(--dim2);
  margin-top:6px}
.empty-verse .en{writing-mode:vertical-rl;font-family:var(--latin);font-size:10px;
  letter-spacing:.24em;color:var(--latin-c);text-transform:uppercase;margin-top:4px}
.empty-verse .mark{width:26px;height:26px;color:var(--accent);opacity:.7;margin:2px auto 0}
.empty-verse .mark .ni,.empty-verse .mark svg{width:26px;height:26px}
/* 消息入场：模糊散开 + 轻轻落下来，420ms */
.turn{margin-bottom:24px;animation:msgIn 420ms cubic-bezier(.22,.8,.3,1) forwards}
/* 元信息在气泡**下方**：10px、字距 .24em、A7B0BB */
.turn .meta{font-family:var(--latin);font-size:10px;letter-spacing:.24em;color:var(--tx-3);
  text-transform:uppercase;margin:10px 0 0}
.turn .meta .who{font-family:var(--font);letter-spacing:.14em;font-size:11px}
/* AI：墨晕软边 —— 没有描边，就是纸上一团化开的墨 */
.turn.ai .bubble{
  border-radius:22px 30px 26px 18px;
  background:var(--nest-ai-bubble,rgba(110,130,150,.10));
  border:0;
  color:var(--nest-ai-fg,var(--tx-1));
}
/* 我：海沫玻璃 —— 右下角一个 6px 的指向 */
.turn.me .bubble{
  border-radius:22px 22px 6px 22px;
  background:var(--nest-me-bubble,rgba(220,234,243,.58));
  color:var(--nest-me-fg,var(--tx-1));
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--glass-line);
}
:root[data-moon="1"] .turn.ai .bubble{background:var(--nest-ai-bubble,rgba(110,140,175,.14))}

#composer{padding:8px var(--pad) calc(10px + env(safe-area-inset-bottom))}

   原来那排六格 + 正中间凸起 26px 的心都在 nest-tabs.js 里，一并删掉了；

/* ── 抽屉 ── */
#drawer{position:fixed;inset:0;z-index:60;background:rgba(70,100,130,.18);

#drawer .panel{position:absolute;left:0;top:0;bottom:0;width:min(300px,84vw);

<div id="gate"><div class="card glass">

<script>
"use strict";
/* ══════ 身份：顶栏的名字 · 英文小标 · 双方的圆头像 ══════
   ★ 存在 /api/config 里：`ai`（他）和 `me`（我）各一份 {name, sign, avatar}。
     头像走 /api/upload（跟表情包同一条路），存的是一条图片地址。 */
const IDENT={ai:{},me:{}};
function paintAva(host,v,fallbackIcon){
  if(!host)return;
  host.innerHTML="";
  const u=(v||"").trim();
  if(/^(\/|https?:|data:image)/i.test(u)){
    const im=document.createElement("img"); im.src=u; im.alt="";
    im.onerror=()=>{ host.innerHTML=""; host.append(nestIcon(fallbackIcon,16)); };
    host.append(im); return;
  }
  if(u){ host.textContent=u.slice(0,2); return; }
  host.append(nestIcon(fallbackIcon,16));
}
function paintIdent(){
  const nm=$("#aiName"), sub=$("#aiSub");
  const name=(IDENT.ai.name||"").trim()||"他";
  if(nm)nm.textContent=name;
  if(sub){
    /* 英文小标：有签名就用签名（竖排那种气质），没有就用一个安静的词 */
    const s=(IDENT.ai.sign||"").trim();
    sub.textContent=(s?s:"COMPANION").slice(0,18);
  }
  paintAva($("#meAva"),IDENT.me.avatar,"person");
  document.title=name+" · 巢";
}
async function loadIdent(){
  try{
    const r=await fetch("/api/config",{credentials:"same-origin"});
    if(r.ok){
      const c=await r.json();
      IDENT.ai=Object.assign({},(c&&c.ai)||{});
      IDENT.me=Object.assign({},(c&&c.me)||{});
    }
  }catch(e){}
  paintIdent();
  /* 换了助手的人设，顶栏名字跟着走（助手管理里存的是另一位） */
  try{
    const w=await fetch("/api/assistants/who?sid="+encodeURIComponent(SID||"main"),
                        {credentials:"same-origin"});
    if(w.ok){
      const j=await w.json();
      if(j&&j.enabled&&j.assistant&&j.assistant.name){
        IDENT.ai.name=j.assistant.name;
        if(j.assistant.sign)IDENT.ai.sign=j.assistant.sign;
        if(j.assistant.avatar)IDENT.ai.avatar=j.assistant.avatar;
        paintIdent();
        $(".brand"); // no-op：老代码里若有 .brand 引用，这里保证不存在也不报错
      }
    }
  }catch(e){}
}
window.nestIdent={
  load:loadIdent,
  get:()=>IDENT,
  paint:paintIdent,
  async save(who,patch){
    IDENT[who]=Object.assign({},IDENT[who]||{},patch||{});
    paintIdent();
    const body={}; body[who]=patch||{};
    const r=await fetch("/api/config",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    return r.ok;
  }
};

/* ══════ 基础 ══════ */
const SEP="|||";
const $=(s,r=document)=>r.querySelector(s);
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
const pad=n=>String(n).padStart(2,"0");
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
const dayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const splitSay=t=>(t||"").split(SEP).map(s=>s.trim()).filter(Boolean);

let SID=localStorage.getItem("nest_sid")||"";
let JOB="",BUSY=false;

const S=$("#stream");
const atBottom=()=>S.scrollHeight-S.scrollTop-S.clientHeight<120;
const toBottom=(f)=>{if(f||atBottom())S.scrollTop=S.scrollHeight;};
const stat=t=>{$("#stat").textContent=t||"";};

function gate(msg){$("#gate").hidden=false;$("#app").hidden=true;if(msg)$("#gateMsg").textContent=msg;}
function ungated(){$("#gate").hidden=true;$("#app").hidden=false;}

/* ══════ 登录 ══════ */
async function boot(){
  try{
    const r=await fetch("/api/chat/active",{credentials:"same-origin"});
    if(r.status===401){gate("口令");return;}
    ungated();await start();
  }catch(e){gate("连不上服务器");}
}
$("#btnLogin").onclick=async()=>{
  const pw=$("#pw").value; if(!pw)return;
  try{
    const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
    if(r.ok){$("#pw").value="";ungated();await start();}
    else $("#gateMsg").textContent=(r.status===429)?"试太多次了，歇一会儿":"口令不对";
  }catch(e){$("#gateMsg").textContent="连不上服务器";}
};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#btnLogin").click();});

/* ══════ 启动 ══════ */
function emptyVerse(lines){
  const box=el("div","empty-verse");
  const v=el("div","v",lines||"还没说话");
  const ln=el("div","ln");
  const en=el("div","en","SAY SOMETHING");
  const mk=el("div","mark"); mk.append(nestIcon("nest",26));
  const col=el("div"); col.append(mk,en);
  box.append(v,ln,col);
  return box;
}
function paintShellIcons(){
  const put=(sel,name,size)=>{ const b=$(sel); if(b&&!b.querySelector("svg")&&!b.querySelector("img"))
    { b.textContent=""; b.append(nestIcon(name,size)); } };
  put("#btnSide","menu",19);
  put("#btnDrawer","menu",19);
  const gm=$("#gateMark"); if(gm&&!gm.querySelector("svg"))gm.append(nestIcon("nest",44));
}
async function start(){
  paintShellIcons();
  loadIdent();
  S.innerHTML="";
  await loadHistory();
  await checkActive();
}

/* ★ 历史只由这一处画（初次进入的时候）。
   以前这里读的是「今天」的全部记录 —— 不分窗口、也不看有没有被收起来；
   然后 nest-tabs / nest-threads 会在半秒后再按窗口重画一遍。两个画手抢同一块
   #stream：网络慢的时候今天的消息会重出一截；正好撞上它还在回答的时候，
   还会把正在往外流的回复整段抹掉。
   现在这一处一次读对（认窗口 · 跳过收起来的），后面那几个模块不再重画。 */
const hm2=ts=>{const d=new Date((ts||0)*1000);
  return pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());};

async function loadHistory(){
  try{
    const sid=SID||"main";
    const r=await fetch("/api/nest/thread?sid="+encodeURIComponent(sid)+"&limit=120",
                        {credentials:"same-origin"});
    if(r.status===401){gate("登录过期了");return;}
    const j=await r.json();
    const items=(j.items||[]).filter(x=>(x.role==="user"||x.role==="assistant")&&!x.hidden);
    S.innerHTML="";
    if(!items.length){S.append(emptyVerse("这里是你和它的家"));}
    items.forEach(it=>addTurn({id:it.id,role:it.role,content:it.content,think:it.think,
                               tools:it.tools,t:hm2(it.ts),ts:it.ts,
                               files:it.files,superseded:it.superseded}));
    toBottom(true);
  }catch(e){S.append(el("div","errbox","历史读不出来："+e.message));}
}

/* ══════ 渲染 ══════ */
function thinkEl(text){
  const d=el("details","think"),s=el("summary");
  const _i=el("span","ic"); _i.append(nestIcon("spark",15));
  s.append(_i,el("span","lb","思考"),el("span","sec",""));
  const p=el("pre");p.textContent=text||"";
  d.append(s,p);return d;
}
function toolEl(name,state,ms,err,args){
  const d=el("div","tool");d.dataset.state=state||"run";d.dataset.name=name||"";
  const h=el("div","thead");
  const _t=el("span","ticon"); _t.append(nestIcon(state==="ok"?"check":(state==="err"?"close":"clock"),15));
  h.append(_t);
  h.append(el("span","tname",name||"tool"));
  if(ms!=null)h.append(el("span","tms",ms+"ms"));
  h.append(el("span","tcar","▾"));
  const b=el("div","tbody");
  if(args){const a=el("pre","targ");a.textContent=args;b.append(a);}
  if(err){const e=el("pre","terr");e.textContent=err;b.append(e);}
  if(!args&&!err)b.append(el("pre","targ","（点开看参数）"));
  d.append(h,b);
  h.onclick=()=>d.classList.toggle("open");
  return d;
}
/* 表情包：贴在末尾的一张小图。点开还是能看原图（a 包着 img） */
function stickerEl(f){
  const box=el("div","atts");
  const a=el("a","att-sticker"); a.href=f.url; a.target="_blank"; a.rel="noreferrer";
  const im=el("img"); im.src=f.url; im.alt=f.name||"表情"; im.loading="lazy";
  /* ★ 图取不到时**不许悄悄摘掉**。原来写的是 `box.remove()` —— 结果就是
     「他说发了，屏幕上什么都没有」，而且连个能查的痕迹都不留（人只会说「没法显示」，
     我们这边看日志一切正常）。现在换成一个看得见的小条：图没了、点开还是能试。 */
  im.onerror=()=>{
    box.classList.add("sticker-bad");
    box.innerHTML="";
    const _n=el("span","nm");
    _n.append(nestIcon("image",15),document.createTextNode(
      " 这张表情包取不到了（"+(f.name||"表情")+"）—— 图可能被清了，或者没登录"));
    box.append(_n);
  };
  a.append(im); box.append(a);
  if(f.name)box.title=f.name;
  return box;
}
/* 附件：图直接看，文件给个名字，点开是原文件 */
function attachEl(fs){
  const box=el("div","atts");
  (fs||[]).forEach(f=>{
    if(!f||!f.url)return;
    const a=el("a",f.kind==="img"?"att-img":"att-file");
    a.href=f.url;a.target="_blank";a.rel="noreferrer";
    if(f.kind==="img"){
      const im=el("img");im.src=f.url;im.alt=f.name||"";
      // 取不到（没登录 / 文件被清了）就整块摘掉，别在气泡里留个破图标
      im.onerror=()=>a.remove();
      a.append(im);
    }else{
      const _a=el("span","ic"); _a.append(nestIcon("file",15));
      a.append(_a,el("span","nm",f.name||"文件"));
    }
    box.append(a);
  });
  return box.children.length?box:null;
}
function addTurn(it){
  const w=el("div","turn "+(it.role==="user"?"me":"ai")+(it.superseded?" sup":""));
  if(it.id)w.dataset.id=it.id;
  // ★ 收藏过的那句，翻历史时也得亮着星 —— 后端 `/api/nest/thread` 一直带着 starred，
  //   不画的话「收藏」这件事在聊天里等于看不见（点过星的下次进来又是一颗没收藏的）。
  if(it.starred||it.starred===1)w.classList.add("starred");
  const m=el("div","meta");
  m.append(el("span","who",it.role==="user"?"我":"它"));
  m.append(el("span","time",it.t||""));
  const cp=el("button","cp","复制");
  cp.onclick=async()=>{
    try{await navigator.clipboard.writeText(splitSay(it.content).join("\n"));
      cp.textContent="已复制";setTimeout(()=>cp.textContent="复制",1200);}
    catch(e){cp.textContent="复制失败";}
  };
  m.append(cp);
  /* ★ 元信息在气泡**下方**（10px 那一行）—— 所以这里先不 append，
     等正文 / 思考 / 工具 / 附件 / 表情包都摆完，最后才把它挂上去。 */
  if(it.think)w.append(thinkEl(it.think));
  (it.tools||[]).forEach(t=>w.append(toolEl(t.name,t.ok===false?"err":"ok",null,t.err||"","")));
  // ★ 附件的位置分两种：人发的排在正文前面（那是他要说的东西），
  //   他发的表情包排在**末尾** —— 人定的规矩：表情包只用来点缀，放最后。
  const mine=it.role==="user";
  const atts=(it.files||[]);
  const stk=atts.filter(f=>f&&f.sticker);
  const rest=atts.filter(f=>!f||!f.sticker);
  if(mine){ const a0=attachEl(rest); if(a0)w.append(a0); }
  const bs=el("div","bubbles");
  splitSay(it.content).forEach(x=>bs.append(el("div","bubble",x)));
  w.append(bs);
  if(!mine){
    const a1=attachEl(rest); if(a1)w.append(a1);
    stk.forEach(f=>w.append(stickerEl(f)));
  }
  if(it.superseded){
    // ★ 这条是「重新生成」换掉的旧回复。它还在，能读、能复制，但它自己
    //   已经不再记得说过这句（后端把它的 spoken 折成 0 了）—— 说清楚，
    //   免得过几天你问它「你上次不是这么说的吗」，它一脸茫然。
    w.append(el("div","supnote","已被重新生成取代 · 它还在这，但它自己不再记得这一条"));
  }
  w.append(m);          /* 元信息收尾，落在气泡下方 */
  S.append(w);
  return w;
}
function liveTurn(){

function lastTool(L,name){
  for(let i=L.tools.length-1;i>=0;i--){
    const c=L.tools[i];
    if(c.isConnected&&c.dataset.name===name&&c.dataset.state==="run")return c;
  }
  return null;
}
function settle(L){
  L.w.classList.remove("live");

  if(L.t0)L.th.querySelector(".sec").textContent="("+((Date.now()-L.t0)/1000).toFixed(1)+"s)";

/* ══════ 事件处理 ══════ */
function handle(ev,L){
  switch(ev.type){
    case "recv": JOB=ev.job||JOB; break;
    case "stage":{
      /* ★ 只换那行字，别把三颗上浮的海沫一起抹掉（它们一直在跳） */
      L.st.hidden=false;
      let tx=L.st.querySelector(".tx");
      if(!tx){ tx=el("span","tx"); L.st.append(tx); }
      tx.textContent=ev.text||"";
      toBottom();break;}
    case "os":
      if(!L.t0)L.t0=Date.now();
      L.think+=ev.delta||"";
      if(L.th.open)L.th.querySelector("pre").textContent=L.think;
      break;
    case "s":
      if(L.st&&!L.st.hidden){L.st.hidden=true;L.st.textContent="";}
      L.bs.append(el("div","bubble",(ev.text||"").trim()));toBottom();break;
    case "tool_live":{
      const c=toolEl(ev.name,"run");L.tl.append(c);L.tools.push(c);toBottom();break;}
    case "tool":{
      const c=lastTool(L,ev.name);
      if(c){
        const rest=Object.assign({},ev);delete rest.type;delete rest.name;
        const b=c.querySelector(".tbody");let p=b.querySelector(".targ");
        if(!p){p=el("pre","targ");b.append(p);}
        p.textContent=JSON.stringify(rest);
      }
      break;}
    case "tool_done":{
      const c=lastTool(L,ev.name);
      if(c)L.tl.replaceChild(toolEl(ev.name,ev.ok?"ok":"err",ev.ms,ev.err,""),c);
      // ★ 他发的表情包：当场贴在末尾。不然得刷新一次才看得见，
      //   而他刚被告知「贴上了」—— 那种「说了没做」最招人烦。
      if(ev.sticker&&ev.sticker.url&&!L.sticker){
        L.sticker=ev.sticker;
        L.w.append(stickerEl({url:ev.sticker.url,name:ev.sticker.name||"表情",sticker:true}));
      }
      toBottom();break;}
    case "usage": L.usage={tin:ev.tin,tout:ev.tout}; break;
    case "done":
      if(ev.session_id){SID=ev.session_id;localStorage.setItem("nest_sid",SID);}
      break;
    case "error": L.bs.append(el("div","errbox",ev.text||"出错了"));toBottom();break;
    default: break;
  }
}

/* ══════ SSE 收流 ══════ */
async function stream(url,opt,onEv){
  const r=await fetch(url,Object.assign({credentials:"same-origin"},opt));
  if(r.status===401){gate("登录过期了");throw new Error("unauthorized");}
  if(!r.ok||!r.body)throw new Error("HTTP "+r.status);
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){
    const {value,done}=await rd.read(); if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf("\n\n"))>=0){
      const chunk=buf.slice(0,i);buf=buf.slice(i+2);
      for(const line of chunk.split("\n")){
        if(line.slice(0,6)!=="data: ")continue;
        let ev;try{ev=JSON.parse(line.slice(6));}catch(_){continue;}
        onEv(ev);
      }
    }
  }
}

/* ══════ 发送 / 停止 / 续读 ══════ */
async function send(){
  const ta=$("#ta");const text=ta.value.trim();
  const att=(window.nestAttach?window.nestAttach.count():0);
  if((!text&&!att)||BUSY)return;
  /* ★ 附件先送上去，送不上去就整批不发 —— 半批发出去，你不知道少了哪一张。
     暂存区原样留着（含你刚打的那句话），再按一次发送就行。 */
  let files=[];
  if(att){
    setBusy(true);stat("正在送 "+att+" 样过去…");
    try{ files=await window.nestAttach.collect(); }catch(e){ files=null; }
    setBusy(false);
    if(!files){ stat("没送上去，都还留着，再按一次发送");return; }
  }
  ta.value="";grow();
  addTurn({role:"user",content:text,t:nowHM(),files:files});toBottom(true);
  setBusy(true);stat("在想…");
  const L=liveTurn();
  try{
    await stream("/chat",
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({message:text,session_id:SID||undefined,
                            files:files.length?files:undefined})},
      ev=>handle(ev,L));
  }catch(e){
    if(e.message!=="unauthorized")L.bs.append(el("div","errbox","断了："+e.message));
  }
  setBusy(false);stat("");settle(L);toBottom();
}
async function stopJob(){
  if(!JOB)return;
  try{await fetch("/api/chat/stop",{method:"POST",credentials:"same-origin",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({job:JOB})});}catch(e){}
  stat("叫停了…");
}
function setBusy(b){
  BUSY=b;const btn=$("#btnSend");
  btn.textContent=b?"停止":"发送";btn.classList.toggle("stop",b);
}
async function checkActive(){
  try{
    const r=await fetch("/api/chat/active",{credentials:"same-origin"});
    if(!r.ok)return;
    const j=await r.json();
    // ★ 只看「还没说完的」。后端把说完的任务在寄存器里再留半小时
    //   （jobs.KEEP_AFTER_DONE = 1800 秒），不过滤的话每次打开巢都会把
    //   上一条回复从头重播一遍 —— 屏幕上看着像它又把那句话说了第二次。
    //   旧界面一直有这一步（index.html 里 filter(j => !j.done)），巢漏了。
    const list=(j.jobs||[]).filter(x=>!x.done);
    if(!list.length)return;
    const o=list[0]||{};
    const id=o.id||o.job||o.job_id;
    if(id)await attach(String(id));
  }catch(e){}
}
async function attach(id){
  JOB=id;setBusy(true);stat("接回没说完的那句…");
  const L=liveTurn();
  try{await stream("/chat/attach?job="+encodeURIComponent(id)+"&after=0",{},ev=>handle(ev,L));}
  catch(e){if(e.message!=="unauthorized")L.bs.append(el("div","errbox","续读失败："+e.message));}
  setBusy(false);stat("");settle(L);toBottom(true);
}

  async function doRegen(w){
    let p=w.previousElementSibling;
    while(p&&!p.classList.contains("me"))p=p.previousElementSibling;
    if(!p){toast("找不到它回应的那句话");return;}
    const ta=$("#ta");ta.value=turnText(p).split("|||").join("\n");await send();
    toast("重新生成中 —— 原来那条还在，新的接在下面");
  }
  async function doShare(w){
    const t=turnText(w).split("|||").join("\n");
    try{
      if(navigator.share){await navigator.share({text:t});return;}
      await navigator.clipboard.writeText(t);toast("已复制到剪贴板");
    }catch(e){}
  }
  function openMenu(w,btn){
    document.querySelectorAll(".menu").forEach(m=>m.remove());
    const m=el("div","menu");
    const add=(label,fn,danger)=>{
      const b=el("button",danger?"danger":null,label);
      b.onclick=async()=>{m.remove();await fn();};
      m.append(b);
    };
    add("复制",()=>doCopy(w));
    add(w.classList.contains("starred")?"取消收藏":"收藏这句",()=>doStar(w));
    if(w.classList.contains("me"))add("编辑后重发",()=>doEdit(w));
    else add("编辑它的回复",()=>toast("改写它的历史回复要后端接口，第三批给你"));
    add("重新生成",()=>doRegen(w));
    add("分享",()=>doShare(w));
    add("删除本版本",()=>doDel(w),true);
    document.body.append(m);
    const r=btn.getBoundingClientRect();
    m.style.top=(r.bottom+6+scrollY)+"px";
    m.style.left=Math.max(8,Math.min(r.left-140,innerWidth-m.offsetWidth-8))+"px";
    setTimeout(()=>document.addEventListener("click",()=>m.remove(),{once:true}),0);
  }
  function ensureDots(w){
    const meta=w.querySelector(":scope > .meta");
    if(!meta||meta.querySelector(".dots"))return;
    const d=el("button","cp dots","⋯");
    d.onclick=e=>{e.stopPropagation();openMenu(w,d);};
    meta.append(d);
  }
  const mo=new MutationObserver(()=>document.querySelectorAll("#stream .turn").forEach(w=>{
    ensureDots(w); markStar(w);
  }));
  mo.observe($("#stream"),{childList:true,subtree:true});
  document.querySelectorAll("#stream .turn").forEach(w=>{ensureDots(w);markStar(w);});

  /* ★ 让别的模块也能问「这条气泡对应库里哪一行」。
     nest-threads 的「重新生成」要用它拿到那条旧回复的 id —— 后端靠这个 id
     才能把上文切干净、把旧回复折起来。不暴露出去的话，那边只能按正文瞎猜，
     又会猜错行（就是「删了又回来」那个毛病的根子）。 */
  window.nestEnsureId=ensureId;
})();
</script>
