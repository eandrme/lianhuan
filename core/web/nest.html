<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1115">
<title>巢</title>
<style>
/* ══════ 设计变量：以后只改这一块 ══════ */
:root{
  --bg:#0f1115; --panel:#151a21; --panel2:#1b212b; --line:#252c38;
  --fg:#e9edf4; --dim:#96a0b1; --dim2:#6b7486;
  --accent:#7aa2f7; --ok:#5ec27f; --err:#e0716f; --warn:#e0b96f;
  --r:14px; --r-sm:9px; --gap:10px; --pad:14px;
  --fs:15px; --lh:1.62; --colw:760px; --sidew:300px;
  --font:system-ui,-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:var(--fs)/var(--lh) var(--font);
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}

#app{display:flex;height:100dvh}
#chatCol{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:10px var(--pad);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
.brand{font-weight:600;letter-spacing:.5px}
.sp{flex:1}
.ibtn{padding:6px 10px;border-radius:var(--r-sm);color:var(--dim)}
.ibtn:hover{background:var(--panel2);color:var(--fg)}

#stream{flex:1;overflow-y:auto;padding:var(--pad) var(--pad) 18px;scroll-behavior:smooth}
.turn{max-width:var(--colw);margin:0 auto 22px}
.turn .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim2);margin-bottom:6px}
.turn.me .meta{justify-content:flex-end}
.cp{font-size:12px;color:var(--dim2);padding:2px 6px;border-radius:6px}
.cp:hover{background:var(--panel2);color:var(--fg)}
.bubbles{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.turn.me .bubbles{align-items:flex-end}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 13px;max-width:88%;white-space:pre-wrap;word-break:break-word}
.turn.me .bubble{background:var(--accent);border-color:transparent;color:#0b1020}

details.think{margin:0 0 7px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-sm);overflow:hidden}
details.think>summary{list-style:none;cursor:pointer;padding:7px 11px;display:flex;
  gap:7px;align-items:center;font-size:13px;color:var(--dim)}
details.think>summary::-webkit-details-marker{display:none}
details.think pre{margin:0;padding:0 12px 10px;font:12.5px/1.55 var(--mono);
  color:var(--dim);white-space:pre-wrap;max-height:320px;overflow:auto}
details.think .sec{color:var(--dim2)}

.stage{font-size:13px;color:var(--dim);margin:0 0 7px;padding-left:2px}
.stage::before{content:"· ";color:var(--accent)}

.tools{display:flex;flex-direction:column;gap:5px;margin:0 0 7px}
.tool{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);font-size:13px}
.tool .thead{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer}
.tool .tname{font-family:var(--mono);font-size:12.5px}
.tool .tms{color:var(--dim2);font-size:12px}
.tool .tcar{margin-left:auto;color:var(--dim2);transition:transform .15s}
.tool.open .tcar{transform:rotate(180deg)}
.tool .tbody{display:none;border-top:1px solid var(--line);padding:8px 10px}
.tool.open .tbody{display:block}
.tool pre{margin:0;font:12px/1.5 var(--mono);color:var(--dim);white-space:pre-wrap;word-break:break-all}
.tool[data-state=run] .ticon{color:var(--warn)}
.tool[data-state=ok]  .ticon{color:var(--ok)}
.tool[data-state=err] .ticon{color:var(--err)}

.errbox{max-width:88%;border:1px solid var(--err);background:#e0716f1a;color:#f0b3b1;
  border-radius:var(--r-sm);padding:8px 11px;font-size:13px}
.usage{font-size:11.5px;color:var(--dim2);margin-top:6px;font-family:var(--mono)}
.hint{max-width:var(--colw);margin:44px auto;text-align:center;color:var(--dim2);font-size:13px}

#composer{border-top:1px solid var(--line);background:var(--bg);
  padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom))}
#composer .row{max-width:var(--colw);margin:0 auto;display:flex;gap:8px;align-items:flex-end;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 8px 8px 12px}
#ta{flex:1;resize:none;background:none;border:0;outline:none;color:var(--fg);
  font:inherit;max-height:38vh;padding:5px 0}
#btnSend{padding:8px 16px;border-radius:var(--r-sm);background:var(--accent);
  color:#0b1020;font-weight:600;white-space:nowrap}
#btnSend.stop{background:var(--err);color:#1a0d0d}

#side{width:var(--sidew);flex:0 0 var(--sidew);border-left:1px solid var(--line);
  background:var(--panel);overflow:auto;padding:var(--pad);transition:transform .2s ease}
#app.side-off #side{transform:translateX(105%)}
@media (max-width:820px){
  #side{position:fixed;right:0;top:0;bottom:0;z-index:20;box-shadow:-8px 0 24px #0006}
  #app.side-off #side{transform:translateX(105%)}
  .bubble{max-width:94%}
}

#gate{position:fixed;inset:0;background:var(--bg);display:flex;
  align-items:center;justify-content:center;z-index:50}
#gate .card{width:min(340px,86vw);display:flex;flex-direction:column;gap:12px;text-align:center}
#gate input{padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);font:inherit;outline:none}
#gate button{padding:12px;border-radius:var(--r-sm);background:var(--accent);
  color:#0b1020;font-weight:600}
.muted{color:var(--dim2);font-size:12.5px}
</style>
</head>
<body>

<div id="gate"><div class="card">
  <div style="font-size:26px">🪺</div>
  <div><b>巢</b></div>
  <div class="muted" id="gateMsg">口令</div>
  <input id="pw" type="password" placeholder="口令" autocomplete="current-password">
  <button id="btnLogin">进去</button>
</div></div>

<div id="app" class="side-off" hidden>
  <div id="chatCol">
    <div id="bar">
      <span class="brand">巢</span><span class="muted" id="stat"></span>
      <span class="sp"></span>
      <button class="ibtn" id="btnSide" title="侧栏">☰</button>
    </div>
    <div id="stream"></div>
    <div id="composer"><div class="row">
      <textarea id="ta" rows="1" placeholder="跟它说点什么…"></textarea>
      <button id="btnSend">发送</button>
    </div></div>
  </div>
  <aside id="side">
    <div class="muted">侧栏 · 状态卡 / 记忆 / MCP / 工具流水<br>（第二批）</div>
  </aside>
</div>

<script>
"use strict";
/* ══════ 基础 ══════ */
const SEP="|||";
const $=(s,r=document)=>r.querySelector(s);
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
const pad=n=>String(n).padStart(2,"0");
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes());};
const dayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const splitSay=t=>(t||"").split(SEP).map(s=>s.trim()).filter(Boolean);

let SID=localStorage.getItem("nest_sid")||"";
let JOB="",BUSY=false;

const S=$("#stream");
const atBottom=()=>S.scrollHeight-S.scrollTop-S.clientHeight<120;
const toBottom=(f)=>{if(f||atBottom())S.scrollTop=S.scrollHeight;};
const stat=t=>{$("#stat").textContent=t||"";};

function gate(msg){$("#gate").hidden=false;$("#app").hidden=true;if(msg)$("#gateMsg").textContent=msg;}
function ungated(){$("#gate").hidden=true;$("#app").hidden=false;}

/* ══════ 登录 ══════ */
async function boot(){
  try{
    const r=await fetch("/api/chat/active",{credentials:"same-origin"});
    if(r.status===401){gate("口令");return;}
    ungated();await start();
  }catch(e){gate("连不上服务器");}
}
$("#btnLogin").onclick=async()=>{
  const pw=$("#pw").value; if(!pw)return;
  try{
    const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
    if(r.ok){$("#pw").value="";ungated();await start();}
    else $("#gateMsg").textContent=(r.status===429)?"试太多次了，歇一会儿":"口令不对";
  }catch(e){$("#gateMsg").textContent="连不上服务器";}
};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#btnLogin").click();});

/* ══════ 启动 ══════ */
async function start(){
  S.innerHTML="";
  await loadHistory();
  await checkActive();
}

async function loadHistory(){
  try{
    const r=await fetch("/api/chat/day/"+dayStr(),{credentials:"same-origin"});
    if(r.status===401){gate("登录过期了");return;}
    const j=await r.json();
    const items=(j.items||[]).filter(x=>x.role==="user"||x.role==="assistant");
    if(!items.length){S.append(el("div","hint","这里是你和它的家。说点什么。"));}
    items.forEach(it=>addTurn(it));
    toBottom(true);
  }catch(e){S.append(el("div","errbox","历史读不出来："+e.message));}
}

/* ══════ 渲染 ══════ */
function thinkEl(text){
  const d=el("details","think"),s=el("summary");
  s.append(el("span","ic","💡"),el("span","lb","思考"),el("span","sec",""));
  const p=el("pre");p.textContent=text||"";
  d.append(s,p);return d;
}
function toolEl(name,state,ms,err,args){
  const d=el("div","tool");d.dataset.state=state||"run";d.dataset.name=name||"";
  const h=el("div","thead");
  h.append(el("span","ticon",state==="ok"?"✅":state==="err"?"❌":"⏳"));
  h.append(el("span","tname",name||"tool"));
  if(ms!=null)h.append(el("span","tms",ms+"ms"));
  h.append(el("span","tcar","▾"));
  const b=el("div","tbody");
  if(args){const a=el("pre","targ");a.textContent=args;b.append(a);}
  if(err){const e=el("pre","terr");e.textContent=err;b.append(e);}
  if(!args&&!err)b.append(el("pre","targ","（点开看参数）"));
  d.append(h,b);
  h.onclick=()=>d.classList.toggle("open");
  return d;
}
function addTurn(it){
  const w=el("div","turn "+(it.role==="user"?"me":"ai"));
  if(it.id)w.dataset.id=it.id;
  const m=el("div","meta");
  m.append(el("span","who",it.role==="user"?"我":"它"));
  m.append(el("span","time",it.t||""));
  const cp=el("button","cp","复制");
  cp.onclick=async()=>{
    try{await navigator.clipboard.writeText(splitSay(it.content).join("\n"));
      cp.textContent="已复制";setTimeout(()=>cp.textContent="复制",1200);}
    catch(e){cp.textContent="复制失败";}
  };
  m.append(cp);
  w.append(m);
  if(it.think)w.append(thinkEl(it.think));
  (it.tools||[]).forEach(t=>w.append(toolEl(t.name,t.ok===false?"err":"ok",null,t.err||"","")));
  const bs=el("div","bubbles");
  splitSay(it.content).forEach(x=>bs.append(el("div","bubble",x)));
  w.append(bs);
  S.append(w);
  return w;
}
function liveTurn(){
  const w=el("div","turn ai");
  const m=el("div","meta");
  m.append(el("span","who","它"),el("span","time",nowHM()));
  const st=el("div","stage");st.hidden=true;
  const th=thinkEl("");th.hidden=true;
  const tl=el("div","tools");
  const bs=el("div","bubbles");
  w.append(m,st,th,tl,bs);
  S.append(w);toBottom(true);
  return {w,st,th,tl,bs,think:"",t0:0,tools:[],usage:null};
}
function lastTool(L,name){
  for(let i=L.tools.length-1;i>=0;i--){
    const c=L.tools[i];
    if(c.isConnected&&c.dataset.name===name&&c.dataset.state==="run")return c;
  }
  return null;
}
function settle(L){
  L.w.classList.remove("live");
  if(L.think){L.th.hidden=false;L.th.querySelector("pre").textContent=L.think;}
  if(L.t0)L.th.querySelector(".sec").textContent="("+((Date.now()-L.t0)/1000).toFixed(1)+"s)";
  if(L.usage){
    const u=L.usage;
    L.w.append(el("div","usage",
      "↑"+(u.tin||0)+" ↓"+(u.tout||0)+" · 合计 "+((u.tin||0)+(u.tout||0))+" tok"));
  }
}

/* ══════ 事件处理 ══════ */
function handle(ev,L){
  switch(ev.type){
    case "recv": JOB=ev.job||JOB; break;
    case "stage": L.st.hidden=false;L.st.textContent=ev.text||"";toBottom();break;
    case "os":
      if(!L.t0)L.t0=Date.now();
      L.think+=ev.delta||"";
      if(L.th.open)L.th.querySelector("pre").textContent=L.think;
      break;
    case "s":
      if(L.st&&!L.st.hidden){L.st.hidden=true;L.st.textContent="";}
      L.bs.append(el("div","bubble",(ev.text||"").trim()));toBottom();break;
    case "tool_live":{
      const c=toolEl(ev.name,"run");L.tl.append(c);L.tools.push(c);toBottom();break;}
    case "tool":{
      const c=lastTool(L,ev.name);
      if(c){
        const rest=Object.assign({},ev);delete rest.type;delete rest.name;
        const b=c.querySelector(".tbody");let p=b.querySelector(".targ");
        if(!p){p=el("pre","targ");b.append(p);}
        p.textContent=JSON.stringify(rest);
      }
      break;}
    case "tool_done":{
      const c=lastTool(L,ev.name);
      if(c)L.tl.replaceChild(toolEl(ev.name,ev.ok?"ok":"err",ev.ms,ev.err,""),c);
      toBottom();break;}
    case "usage": L.usage={tin:ev.tin,tout:ev.tout}; break;
    case "done":
      if(ev.session_id){SID=ev.session_id;localStorage.setItem("nest_sid",SID);}
      break;
    case "error": L.bs.append(el("div","errbox",ev.text||"出错了"));toBottom();break;
    default: break;
  }
}

/* ══════ SSE 收流 ══════ */
async function stream(url,opt,onEv){
  const r=await fetch(url,Object.assign({credentials:"same-origin"},opt));
  if(r.status===401){gate("登录过期了");throw new Error("unauthorized");}
  if(!r.ok||!r.body)throw new Error("HTTP "+r.status);
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){
    const {value,done}=await rd.read(); if(done)break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf("\n\n"))>=0){
      const chunk=buf.slice(0,i);buf=buf.slice(i+2);
      for(const line of chunk.split("\n")){
        if(line.slice(0,6)!=="data: ")continue;
        let ev;try{ev=JSON.parse(line.slice(6));}catch(_){continue;}
        onEv(ev);
      }
    }
  }
}

/* ══════ 发送 / 停止 / 续读 ══════ */
async function send(){
  const ta=$("#ta");const text=ta.value.trim();
  if(!text||BUSY)return;
  ta.value="";grow();
  addTurn({role:"user",content:text,t:nowHM()});toBottom(true);
  setBusy(true);stat("在想…");
  const L=liveTurn();
  try{
    await stream("/chat",
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({message:text,session_id:SID||undefined})},
      ev=>handle(ev,L));
  }catch(e){
    if(e.message!=="unauthorized")L.bs.append(el("div","errbox","断了："+e.message));
  }
  setBusy(false);stat("");settle(L);toBottom();
}
async function stopJob(){
  if(!JOB)return;
  try{await fetch("/api/chat/stop",{method:"POST",credentials:"same-origin",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({job:JOB})});}catch(e){}
  stat("叫停了…");
}
function setBusy(b){
  BUSY=b;const btn=$("#btnSend");
  btn.textContent=b?"停止":"发送";btn.classList.toggle("stop",b);
}
async function checkActive(){
  try{
    const r=await fetch("/api/chat/active",{credentials:"same-origin"});
    if(!r.ok)return;
    const j=await r.json();const list=j.jobs||[];
    if(!list.length)return;
    const o=list[0]||{};
    const id=o.id||o.job||o.job_id;
    if(id)await attach(String(id));
  }catch(e){}
}
async function attach(id){
  JOB=id;setBusy(true);stat("接回没说完的那句…");
  const L=liveTurn();
  try{await stream("/chat/attach?job="+encodeURIComponent(id)+"&after=0",{},ev=>handle(ev,L));}
  catch(e){if(e.message!=="unauthorized")L.bs.append(el("div","errbox","续读失败："+e.message));}
  setBusy(false);stat("");settle(L);toBottom(true);
}

/* ══════ 输入区 ══════ */
const ta=$("#ta");
function grow(){ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,innerHeight*0.38)+"px";}
ta.addEventListener("input",grow);
ta.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!BUSY)send();}
});
$("#btnSend").onclick=()=>{BUSY?stopJob():send();};
$("#btnSide").onclick=()=>$("#app").classList.toggle("side-off");

/* ══ 第二批（消息操作 · 侧栏）追加区 ══ */
boot();
</script>
</body>
</html>
